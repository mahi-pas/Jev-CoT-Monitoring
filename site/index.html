<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoT safety classification</title>
  <style>
    :root {
      --ink: #1a1c1a;
      --muted: #3f453f;
      --faint: #5e675e;
      --line: #d9ddd4;
      --paper: #f3f4ef;
      --card: #ffffff;
      --jev: #1e3a5f;
      --sonnet: #8d3d2b;
      --luna: #1b6b45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 24px 0 64px;
    }

    header {
      margin-bottom: 16px;
    }

    .kicker {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 17px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 16px 0 8px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent);
      padding: 18px 20px 16px;
    }

    .kpi .model {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .kpi .value {
      margin: 6px 0 0;
      font-size: 48px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .kpi .detail {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    section {
      margin-top: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 22px 22px 18px;
    }

    h2 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: -0.01em;
    }

    .caption {
      margin: 0 0 16px;
      color: var(--faint);
      font-size: 14px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 650;
    }

    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
    }

    svg text {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      fill: var(--ink);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
    }

    th, td {
      text-align: right;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    th:first-child, td:first-child { text-align: left; }

    th {
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 700;
    }

    .note {
      margin: 18px 0 0;
      color: var(--faint);
      font-size: 14px;
    }

    #status {
      margin-top: 24px;
      color: var(--sonnet);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">ReasoningShield test set · 2,200 traces</p>
      <h1>CoT safety classification</h1>
      <p class="lede">Jev, Claude Sonnet 5, and GPT-5.6 Luna each labeled the reasoning trace as Safe, Potentially harmful, or Harmful. Accuracy is an exact match to the human majority label, counted only on calls that returned a level.</p>
    </header>
    <div id="status" hidden></div>
    <div id="report"></div>
  </main>
  <script>
    const COLORS = {
      "Jev": "#1e3a5f",
      "Claude Sonnet 5": "#8d3d2b",
      "GPT-5.6 Luna": "#1b6b45"
    };
    const MODELS = ["Jev", "Claude Sonnet 5", "GPT-5.6 Luna"];
    const LEVELS = ["Safe", "Potentially harmful", "Harmful"];

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines[0].split(",");
      return lines.slice(1).filter(Boolean).map((line) => {
        const cols = line.split(",");
        const row = {};
        headers.forEach((header, index) => {
          row[header] = cols[index];
        });
        row.value = Number(row.value);
        row.n = Number(row.n);
        return row;
      });
    }

    function pick(rows, classifier, metric, group, groupValue) {
      return rows.find((row) =>
        row.classifier === classifier &&
        row.metric === metric &&
        row.group === group &&
        row.group_value === groupValue
      );
    }

    function pct(value) {
      return (value * 100).toFixed(1);
    }

    function money(value) {
      if (value >= 1) return `$${value.toFixed(2)}`;
      if (value >= 0.1) return `$${value.toFixed(2)}`;
      return `$${value.toFixed(3)}`;
    }

    function titleCase(value) {
      return value.replace(/\b[a-z]/g, (letter) => letter.toUpperCase());
    }

    function legend(items) {
      return `<div class="legend">${items.map((item) =>
        `<span><i class="swatch" style="background:${item.color}"></i>${item.label}</span>`
      ).join("")}</div>`;
    }

    function verticalChart({ categories, values, colors, yMax, unit, valueText, axisName, tickFormat }) {
      const width = 1000;
      const height = 380;
      const pad = { l: 72, r: 24, t: 36, b: 92 };
      const plotW = width - pad.l - pad.r;
      const plotH = height - pad.t - pad.b;
      const slot = plotW / categories.length;
      const barW = Math.min(120, slot * 0.46);
      const ticks = 4;
      let grid = "";
      let yLabels = "";
      for (let tick = 0; tick <= ticks; tick += 1) {
        const ratio = tick / ticks;
        const y = pad.t + plotH - ratio * plotH;
        const label = tickFormat ? tickFormat(yMax * ratio) : (unit === "%" ? Math.round(yMax * ratio) : Math.round(yMax * ratio).toLocaleString("en-US"));
        grid += `<line x1="${pad.l}" y1="${y}" x2="${width - pad.r}" y2="${y}" stroke="#e3e6dc" stroke-width="1"/>`;
        yLabels += `<text x="${pad.l - 10}" y="${y + 5}" text-anchor="end" font-size="14">${label}</text>`;
      }
      let bars = "";
      categories.forEach((category, index) => {
        const value = values[index];
        const x = pad.l + slot * index + (slot - barW) / 2;
        const barH = (value / yMax) * plotH;
        const y = pad.t + plotH - barH;
        const label = valueText(value);
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${colors[index]}"/>`;
        bars += `<text x="${x + barW / 2}" y="${y - 10}" text-anchor="middle" font-size="16" font-weight="700">${label}</text>`;
        const lines = category.split("\n");
        lines.forEach((line, lineIndex) => {
          bars += `<text x="${x + barW / 2}" y="${pad.t + plotH + 28 + lineIndex * 22}" text-anchor="middle" font-size="15" font-weight="650">${line}</text>`;
        });
      });
      const axisLabel = axisName || (unit === "%" ? "Percent" : "Milliseconds");
      return `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img">
        ${grid}${yLabels}${bars}
        <text x="16" y="${pad.t + plotH / 2}" text-anchor="middle" font-size="13" fill="#5e675e" transform="rotate(-90 16 ${pad.t + plotH / 2})">${axisLabel}</text>
      </svg>`;
    }

    function horizontalChart({ categories, series, yMax }) {
      const width = 1040;
      const labelW = 236;
      const gutter = 58;
      const top = 8;
      const barH = 18;
      const barGap = 6;
      const groupGap = 18;
      const groupH = series.length * barH + (series.length - 1) * barGap;
      const height = top + categories.length * (groupH + groupGap) + 28;
      const plotX = labelW;
      const plotW = width - labelW - gutter;
      let marks = "";
      for (let tick = 0; tick <= 4; tick += 1) {
        const x = plotX + (tick / 4) * plotW;
        marks += `<line x1="${x}" y1="${top}" x2="${x}" y2="${height - 26}" stroke="#e3e6dc"/>`;
        marks += `<text x="${x}" y="${height - 8}" text-anchor="middle" font-size="13" fill="#5e675e">${Math.round(yMax * tick / 4)}</text>`;
      }
      let rows = "";
      categories.forEach((category, categoryIndex) => {
        const y0 = top + categoryIndex * (groupH + groupGap);
        rows += `<text x="${labelW - 12}" y="${y0 + groupH / 2 + 5}" text-anchor="end" font-size="15">${category}</text>`;
        series.forEach((seriesItem, seriesIndex) => {
          const value = seriesItem.data[categoryIndex];
          const y = y0 + seriesIndex * (barH + barGap);
          const barW = (value / yMax) * plotW;
          rows += `<rect x="${plotX}" y="${y}" width="${barW}" height="${barH}" fill="${seriesItem.color}"/>`;
          rows += `<text x="${plotX + plotW + 10}" y="${y + 14}" font-size="14" font-weight="700">${value.toFixed(1)}</text>`;
        });
      });
      return `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img">
        ${marks}${rows}
      </svg>`;
    }

    function render(rows) {
      const cards = MODELS.map((model) => {
        const accuracy = pick(rows, model, "exact_match_accuracy", "overall", "labeled");
        const latency = pick(rows, model, "mean_latency", "overall", "labeled");
        const cost = pick(rows, model, "mean_cost_usd", "overall", "per_call");
        const price = cost ? ` · ${money(cost.value * 1000)} / 1,000` : "";
        return `<article class="kpi" style="--accent:${COLORS[model]}">
          <p class="model">${model}</p>
          <p class="value">${pct(accuracy.value)}%</p>
          <p class="detail">${Math.round(latency.value).toLocaleString("en-US")} ms mean${price}</p>
        </article>`;
      }).join("");

      const accuracyChart = verticalChart({
        categories: ["Jev", "Claude\nSonnet 5", "GPT-5.6\nLuna"],
        values: MODELS.map((model) => Number(pct(pick(rows, model, "exact_match_accuracy", "overall", "labeled").value))),
        colors: MODELS.map((model) => COLORS[model]),
        yMax: 100,
        unit: "%",
        valueText: (value) => `${value.toFixed(1)}%`
      });

      const latencyChart = verticalChart({
        categories: ["Jev", "Claude\nSonnet 5", "GPT-5.6\nLuna"],
        values: MODELS.map((model) => pick(rows, model, "mean_latency", "overall", "labeled").value),
        colors: MODELS.map((model) => COLORS[model]),
        yMax: 4000,
        unit: "ms",
        valueText: (value) => `${Math.round(value).toLocaleString("en-US")} ms`
      });

      const f1Series = MODELS.map((model) => ({
        label: model,
        color: COLORS[model],
        data: LEVELS.map((level) => Number(pct(pick(rows, model, "f1", "safety_level", level).value)))
      }));

      const categories = [];
      rows.forEach((row) => {
        if (row.metric === "exact_match_accuracy" && row.group === "risk_category" && row.classifier === "Jev" && !categories.includes(row.group_value)) {
          categories.push(row.group_value);
        }
      });
      const categorySeries = MODELS.map((model) => ({
        label: model,
        color: COLORS[model],
        data: categories.map((category) => Number(pct(pick(rows, model, "exact_match_accuracy", "risk_category", category).value)))
      }));

      const tableRows = MODELS.map((model) => {
        const accuracy = pick(rows, model, "exact_match_accuracy", "overall", "labeled");
        const mean = pick(rows, model, "mean_latency", "overall", "labeled");
        const median = pick(rows, model, "median_latency", "overall", "labeled");
        const macro = pick(rows, model, "macro_f1", "overall", "labeled");
        const cost = pick(rows, model, "mean_cost_usd", "overall", "per_call");
        const total = pick(rows, model, "total_cost_usd", "overall", "test_set");
        const matches = Math.round(accuracy.value * accuracy.n);
        return `<tr>
          <td>${model}</td>
          <td>${accuracy.n.toLocaleString("en-US")}</td>
          <td>${matches.toLocaleString("en-US")}</td>
          <td>${pct(accuracy.value)}%</td>
          <td>${pct(macro.value)}%</td>
          <td>${Math.round(mean.value).toLocaleString("en-US")}</td>
          <td>${Math.round(median.value).toLocaleString("en-US")}</td>
          <td>${cost ? money(cost.value * 1000) : ""}</td>
          <td>${total ? money(total.value) : ""}</td>
        </tr>`;
      }).join("");

      const priceChart = verticalChart({
        categories: ["Jev", "Claude\nSonnet 5", "GPT-5.6\nLuna"],
        values: MODELS.map((model) => pick(rows, model, "mean_cost_usd", "overall", "per_call").value * 1000),
        colors: MODELS.map((model) => COLORS[model]),
        yMax: 4,
        unit: "usd",
        axisName: "USD per 1,000",
        tickFormat: (value) => `$${value.toFixed(0)}`,
        valueText: (value) => money(value)
      });

      document.getElementById("report").innerHTML = `
        <div class="kpis">${cards}</div>
        <section id="price">
          <h2>Price per 1,000 classifications</h2>
          <p class="caption">Estimated dollars for 1,000 calls. Measured on six trace lengths, then scaled to all 2,200 traces. Jev uses input tokens at $0.042 per million. Sonnet and Luna use the dollar cost OpenRouter returned on those calls.</p>
          ${legend(MODELS.map((model) => ({ label: model, color: COLORS[model] })))}
          ${priceChart}
        </section>
        <section>
          <h2>Exact-match accuracy</h2>
          <p class="caption">Share of labeled calls whose safety level matched the human majority. Axis: percent.</p>
          ${legend(MODELS.map((model) => ({ label: model, color: COLORS[model] })))}
          ${accuracyChart}
        </section>
        <section>
          <h2>Mean classification time</h2>
          <p class="caption">Average wall-clock time for calls that returned a safety level. Axis: milliseconds. Medians are in the table below.</p>
          ${legend(MODELS.map((model) => ({ label: model, color: COLORS[model] })))}
          ${latencyChart}
        </section>
        <section>
          <h2>F1 by safety level</h2>
          <p class="caption">F1 for Safe (0), Potentially harmful (0.5), and Harmful (1), on labeled calls. Axis: percent.</p>
          ${legend(f1Series)}
          ${horizontalChart({ categories: LEVELS, series: f1Series, yMax: 100 })}
        </section>
        <section>
          <h2>Exact-match accuracy by risk category</h2>
          <p class="caption">Exact match within each query risk category, on labeled calls. Axis: percent.</p>
          ${legend(categorySeries)}
          ${horizontalChart({ categories: categories.map(titleCase), series: categorySeries, yMax: 100 })}
        </section>
        <section>
          <h2>Comparison table</h2>
          <p class="caption">Labeled calls are requests that returned a safety level. Time is milliseconds. Price is the estimated cost in dollars.</p>
          <table>
            <thead>
              <tr>
                <th>Classifier</th>
                <th>Labeled calls</th>
                <th>Exact matches</th>
                <th>Accuracy</th>
                <th>Macro F1</th>
                <th>Mean ms</th>
                <th>Median ms</th>
                <th>USD / 1,000</th>
                <th>USD for 2,200</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
          <p class="note">Source: ReasoningShield-Test human majority labels · figures read from results/summary.csv. Edit that file and refresh to update the page.</p>
        </section>
      `;
    }

    fetch("../results/summary.csv")
      .then((response) => {
        if (!response.ok) throw new Error("Could not load results/summary.csv");
        return response.text();
      })
      .then((text) => render(parseCsv(text)))
      .catch((error) => {
        const status = document.getElementById("status");
        status.hidden = false;
        status.textContent = error.message;
      });
  </script>
</body>
</html>
